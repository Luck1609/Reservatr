name: Publish app to production

on:
  push:
    branches:
      - stage

jobs:
  FTP-Deploy-Action:
    name: FTP-Deploy-Action
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Set up PHP and Composer
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: 'composer'

    - name: Install Composer dependencies
      run: composer install --no-progress --no-suggest --prefer-dist

    # Set up Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    # Install bun dependencies
    - name: Install bun dependencies
      run: bun install

    # Build frontend assets
    - name: Build assets
      run: bun run build

    # Remove node_modules after build
    - name: Remove node_modules
      run: rm -rf node_modules

    # Remove vendor after build
    - name: Remove vendor dir
      run: rm -rf vendor

    - name: Remove tests dir
      run: rm -rf tests

    - name: Remove vendor dir
      run: rm -rf vendor

    - name: Remove .git dir
      run: rm -rf .git

    - name: Remove .github dir
      run: rm -rf .github

    # FTP deploy
    - name: FTP-Deploy-Action
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ftp.homesteller.com
        # server: premium57.web-hosting.com
        username: ${{ secrets.STAGE_USERNAME }}
        password: ${{ secrets.STAGE_SECRET }}
