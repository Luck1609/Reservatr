<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Reservatr calendar R icon</title>
  <desc id="desc">A navy and teal diagonal calendar with a white italic R, teal binder rings and a sweeping orbit.</desc>
  <defs>
    <linearGradient id="teal" x1="322" y1="314" x2="813" y2="914" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09D3B4"/>
      <stop offset="1" stop-color="#00B99F"/>
    </linearGradient>
    <linearGradient id="orbit" x1="130" y1="830" x2="921" y2="719" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05CFAE"/>
      <stop offset=".49" stop-color="#B9FFF4"/>
      <stop offset="1" stop-color="#00B99F"/>
    </linearGradient>
    <clipPath id="calendar">
      <path d="M308 216h-1c-82 0-149 67-149 149v424c0 82 67 149 149 149h420c82 0 149-67 149-149V342c0-70-57-126-127-126h-7v45c0 42-34 76-76 76s-76-34-76-76v-45H422v45c0 42-34 76-76 76s-76-34-76-76v-45h38Z"/>
    </clipPath>
  </defs>
  <!-- Calendar body with open binder-ring notches -->
  <path fill="#06225F" d="M308 216h-1c-82 0-149 67-149 149v424c0 82 67 149 149 149h420c82 0 149-67 149-149V342c0-70-57-126-127-126h-7v45c0 42-34 76-76 76s-76-34-76-76v-45H422v45c0 42-34 76-76 76s-76-34-76-76v-45h38Z"/>
  <g clip-path="url(#calendar)">
    <path fill="url(#teal)" d="M900 306v692H168l732-692Z"/>
  </g>
  <!-- Binder rings -->
  <rect x="326" y="140" width="78" height="154" rx="39" fill="url(#teal)"/>
  <rect x="620" y="140" width="78" height="154" rx="39" fill="url(#teal)"/>
  <!-- Italic R cut from a bold, custom-drawn glyph -->
  <path fill="#FFF" d="M262 741 396 363h194c99 0 155 42 155 113 0 70-47 119-123 141l95 143H580l-81-128h-50l-44 128H262Zm211-221h69c36 0 56-14 56-40 0-23-17-34-51-34h-47l-27 74Z"/>
  <!-- Orbit sweeps in front of the calendar -->
  <path d="M867 543c73 18 109 50 101 82-13 54-178 129-387 181-213 54-392 68-425 34-24-25 14-75 92-124-116 62-183 125-170 171 19 66 207 68 474 2 267-66 462-174 434-239-12-29-55-53-119-69Z" fill="url(#orbit)"/>
</svg>
